rm:translateY(-3px);box-shadow:0 10px 25px #24345a12}.icon{font-size:28px}.card h3{margin:12px 0 6px}.card p{color:#7c8494;font-size:13px;line-height:1.5}footer{padding:40px 0 15px;text-align:center;color:#8a90a0;font-size:13px}@media(max-width:600px){.wrap{padding:18px 13px}.panel{padding:17px}.top{align-items:flex-start}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html"><b>⚙</b>FreeToolHub</a><a class="back" href="index.html">← All tools</a></header><section class="hero"><div class="eyebrow">Calculators</div><h1>Loan Calculator</h1><p class="desc">Estimate monthly payment and total interest for a fixed-rate loan.</p></section><section class="panel"><div class="row"><div class="field"><label>Loan amount</label><input id="p" type="number" value="100000"></div><div class="field"><label>Annual interest (%)</label><input id="r" type="number" value="10" step="0.1"></div><div class="field"><label>Term (months)</label><input id="n" type="number" value="12"></div><button class="btn" id="go">Calculate</button></div><div id="out" class="result"></div></section><footer>Files are processed in your browser where supported. © 2026 FreeToolHub.</footer></main><script>const $=id=>document.getElementById(id);$('go').onclick=()=>{const p=+$('p').value,r=+$('r').value/1200,n=+$('n').value;if(p<=0||n<=0)return $('out').textContent='Enter positive amount and term.';const m=r? p*r/(1-Math.pow(1+r,-n)):p/n;$('out').textContent='Estimated monthly payment: '+m.toFixed(2)+' · Total interest: '+(m*n-p).toFixed(2)}</script></body></html>
