<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator | FreeToolHub</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f8fc;color:#182033}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:32px}.brand{font-size:22px;font-weight:800;color:#202844;text-decoration:none}.brand b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#3478f6,#7542e9);color:#dfe3e8;margin-right:9px}.back{color:#5947d8;text-decoration:none;font-weight:700}.hero{margin:24px 0}.eyebrow{color:#7054dd;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px}h1{font-size:clamp(28px,4vw,40px);margin:8px 0}.desc{color:#737b8d;line-height:1.6}.panel{background:#fff;border:1px solid #e8eaf2;border-radius:18px;padding:24px;box-shadow:0 8px 26px #1c2a4a0b;margin-top:22px}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:end}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:170px}label{font-weight:700;font-size:13px;color:#46506a}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #dfe3ed;border-radius:10px;font:inherit;background:#fff;color:#182033}textarea{min-height:140px;resize:vertical}.btn{border:0;border-radius:10px;padding:12px 18px;background:linear-gradient(110deg,#3478f6,#853ee7);color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#edf0ff;color:#5142c8}.result{margin-top:18px;padding:14px;border-radius:12px;background:#f4f5ff;line-height:1.6;overflow-wrap:anywhere}.muted{color:#81899a;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;padding:20px;border:1px solid #e8eaf2;border-radius:16px;text-decoration:none;color:inherit;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #24345a12}.icon{font-size:28px}.card h3{margin:12px 0 6px}.card p{color:#7c8494;font-size:13px;line-height:1.5}footer{padding:40px 0 15px;text-align:center;color:#8a90a0;font-size:13px}@media(max-width:600px){.wrap{padding:18px 13px}.panel{padding:17px}.top{align-items:flex-start}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html"><b>⚙</b>FreeToolHub</a><a class="back" href="index.html">← All tools</a></header><section class="hero"><div class="eyebrow">Productivity</div><h1>QR Code Generator</h1><p class="desc">Create a QR code from text or a URL. Internet required to load the QR library.</p></section><section class="panel"><div class="field"><label>Text or URL</label><input id="txt" placeholder="https://example.com"></div><button class="btn" id="go" style="margin-top:14px">Generate QR</button><div id="out" class="result"></div></section><footer>Files are processed in your browser where supported. © 2026 FreeToolHub.</footer></main><script>const $=id=>document.getElementById(id);$('go').onclick=async()=>{try{const QR=await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm');const c=document.createElement('canvas');await QR.toCanvas(c,$('txt').value||' ',{width:240});$('out').replaceChildren(c);const a=document.createElement('a');a.textContent='Download QR';a.href=c.toDataURL();a.download='qrcode.png';$('out').append(document.createElement('br'),a)}catch(e){$('out').textContent='QR library could not load. Check internet.'}}</script></body></html>
